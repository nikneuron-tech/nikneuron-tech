<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="cloudBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#402a06" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#1c1203" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#050300" stop-opacity="1"/>
      <stop offset="100%" stop-color="#010100" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreAuraGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ff5aa5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050618" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-Bleed Dark Space Background -->
  <rect width="1024" height="1024" fill="url(#cloudBg)"/>

  <!-- Center Atmospheric Core Aura -->
  <circle cx="512" cy="420" r="280" fill="url(#coreAuraGold)"/>

  <!-- Server Rack / Kubernetes Mesh (Centered at 512, 420) -->
  <g transform="translate(512, 420)" filter="url(#glowGold)">
    <!-- Central Cluster Node -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="rgba(38, 26, 6, 0.85)" stroke="#fbbf24" stroke-width="3"/>
    
    <!-- Satellite Hex Nodes -->
    <g transform="translate(190, -80) scale(0.65)">
      <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="rgba(38, 26, 6, 0.7)" stroke="#4fd8ff" stroke-width="2.5"/>
    </g>
    <g transform="translate(-190, -80) scale(0.65)">
      <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="rgba(38, 26, 6, 0.7)" stroke="#4fd8ff" stroke-width="2.5"/>
    </g>
    <g transform="translate(0, 180) scale(0.65)">
      <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="rgba(38, 26, 6, 0.7)" stroke="#ff5aa5" stroke-width="2.5"/>
    </g>

    <!-- Interconnect Lines -->
    <line x1="0" y1="-65" x2="190" y2="-80" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 5"/>
    <line x1="0" y1="-65" x2="-190" y2="-80" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 5"/>
    <line x1="0" y1="65" x2="0" y2="180" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 5"/>

    <!-- Inner Core Icon -->
    <circle cx="0" cy="0" r="36" fill="#fbbf24"/>
    <path d="M -16 -8 L 0 8 L 16 -8" fill="none" stroke="#050612" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Telemetry Nodes in corners -->
  <circle cx="210" cy="220" r="14" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="814" cy="220" r="14" fill="none" stroke="#4fd8ff" stroke-width="2"/>
</svg>
