<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="dataBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a2856" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#05122c" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#020410" stop-opacity="1"/>
      <stop offset="100%" stop-color="#010206" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreAuraBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0a3cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050618" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-Bleed Dark Space Background -->
  <rect width="1024" height="1024" fill="url(#dataBg)"/>

  <!-- Center Atmospheric Core Aura -->
  <circle cx="512" cy="420" r="280" fill="url(#coreAuraBlue)"/>

  <!-- Volumetric Data Matrix & Predictive Graph (Centered at 512, 420) -->
  <g transform="translate(512, 420)" filter="url(#glowBlue)">
    <!-- Base Grid Frame -->
    <rect x="-240" y="-160" width="480" height="290" rx="18" fill="rgba(12, 26, 65, 0.85)" stroke="#60a5fa" stroke-width="2.5"/>

    <!-- Grid Horizontal Lines -->
    <line x1="-240" y1="-50" x2="240" y2="-50" stroke="rgba(96, 165, 250, 0.18)"/>
    <line x1="-240" y1="40" x2="240" y2="40" stroke="rgba(96, 165, 250, 0.18)"/>

    <!-- Data Bars -->
    <rect x="-190" y="30" width="32" height="75" rx="5" fill="#4fd8ff"/>
    <rect x="-135" y="-10" width="32" height="115" rx="5" fill="rgba(96, 165, 250, 0.6)"/>
    <rect x="-80" y="-60" width="32" height="165" rx="5" fill="#60a5fa"/>
    <rect x="-25" y="-20" width="32" height="125" rx="5" fill="rgba(96, 165, 250, 0.6)"/>
    <rect x="30" y="-100" width="32" height="205" rx="5" fill="#ff5aa5"/>
    <rect x="85" y="-50" width="32" height="155" rx="5" fill="#4fd8ff"/>
    <rect x="140" y="-120" width="32" height="225" rx="5" fill="#ffffff"/>

    <!-- Predictive Spline Trajectory Line -->
    <path d="M -174 40 Q -80 -85 46 -115 T 156 -130" fill="none" stroke="#ff5aa5" stroke-width="4"/>
    <circle cx="156" cy="-130" r="8" fill="#ff5aa5"/>
  </g>

  <!-- High-Level KPI Indicators in corners -->
  <circle cx="210" cy="220" r="14" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="814" cy="220" r="14" fill="none" stroke="#ff5aa5" stroke-width="2"/>
</svg>
