<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="uiBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#360a48" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#180426" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#05020c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#010105" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreAuraPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5aa5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0a3cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050618" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-Bleed Dark Cyber Space Background -->
  <rect width="1024" height="1024" fill="url(#uiBg)"/>

  <!-- Center Atmospheric Core Aura -->
  <circle cx="512" cy="420" r="280" fill="url(#coreAuraPink)"/>

  <!-- 3D Isometric View Planes / Glass Card Ensemble (Centered at 512, 420) -->
  <g transform="translate(512, 420) skewX(-14) rotate(-8)" filter="url(#glowPink)">
    <!-- Back Card -->
    <rect x="-220" y="-150" width="440" height="270" rx="22" fill="rgba(255, 90, 165, 0.12)" stroke="#ff5aa5" stroke-width="2.5"/>
    
    <!-- Middle Card -->
    <rect x="-180" y="-100" width="440" height="270" rx="22" fill="rgba(10, 60, 255, 0.22)" stroke="#4fd8ff" stroke-width="2.5"/>
    
    <!-- Front Glass Floating Card -->
    <rect x="-140" y="-50" width="440" height="270" rx="22" fill="rgba(25, 20, 60, 0.85)" stroke="#ffffff" stroke-width="3"/>

    <!-- UI Wireframes on Front Card -->
    <circle cx="-80" cy="0" r="22" fill="#4fd8ff"/>
    <rect x="-40" y="-10" width="160" height="20" rx="6" fill="#ffffff"/>
    <rect x="-140" y="60" width="360" height="50" rx="10" fill="rgba(255, 90, 165, 0.3)" stroke="#ff5aa5" stroke-width="2"/>
    <text x="40" y="92" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">SPATIAL CANVAS 3D</text>
  </g>

  <!-- Spatial Reticle Indicators -->
  <circle cx="210" cy="220" r="16" fill="none" stroke="#ff5aa5" stroke-width="2.5"/>
  <circle cx="210" cy="220" r="4" fill="#ffffff"/>
  
  <circle cx="814" cy="220" r="20" fill="none" stroke="#4fd8ff" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="814" cy="220" r="5" fill="#4fd8ff"/>
</svg>
