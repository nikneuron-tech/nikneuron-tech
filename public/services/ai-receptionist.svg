<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="aiBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0a2a5e" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#061436" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#02040d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#010206" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd8ff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0a3cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050618" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-Bleed Dark Cyber Space Background -->
  <rect width="1024" height="1024" fill="url(#aiBg)"/>

  <!-- Center Atmospheric Core Aura -->
  <circle cx="512" cy="420" r="280" fill="url(#coreAura)"/>

  <!-- Cyber Grid Lines in background -->
  <g stroke="rgba(79, 216, 255, 0.08)" stroke-width="1.5">
    <line x1="0" y1="210" x2="1024" y2="210"/>
    <line x1="0" y1="420" x2="1024" y2="420"/>
    <line x1="0" y1="630" x2="1024" y2="630"/>
    <line x1="256" y1="0" x2="256" y2="1024"/>
    <line x1="512" y1="0" x2="512" y2="1024"/>
    <line x1="768" y1="0" x2="768" y2="1024"/>
  </g>

  <!-- Central Neural Voice Sphere & Concentric Rings (Centered at 512, 420) -->
  <circle cx="512" cy="420" r="220" fill="none" stroke="rgba(79, 216, 255, 0.2)" stroke-width="2" stroke-dasharray="12 8"/>
  <circle cx="512" cy="420" r="170" fill="none" stroke="#4fd8ff" stroke-width="3" filter="url(#glowCyan)"/>
  <circle cx="512" cy="420" r="125" fill="rgba(10, 60, 255, 0.15)" stroke="#ff5aa5" stroke-width="2.5"/>

  <!-- Audio Waveform Bars (24/7 Voice Listening) -->
  <g transform="translate(512, 420)" fill="#4fd8ff" filter="url(#glowCyan)">
    <rect x="-84" y="-30" width="10" height="60" rx="5"/>
    <rect x="-56" y="-60" width="10" height="120" rx="5"/>
    <rect x="-28" y="-40" width="10" height="80" rx="5"/>
    <rect x="-8" y="-85" width="16" height="170" rx="8" fill="#ffffff"/>
    <rect x="18" y="-45" width="10" height="90" rx="5"/>
    <rect x="46" y="-65" width="10" height="130" rx="5"/>
    <rect x="74" y="-25" width="10" height="50" rx="5"/>
  </g>

  <!-- Floating HUD Nodes & Calendar Booking Target -->
  <g stroke="#4fd8ff" stroke-width="2" fill="none">
    <!-- Left Node -->
    <circle cx="270" cy="300" r="38" fill="rgba(6, 16, 45, 0.85)"/>
    <path d="M 252 300 h 36 M 270 282 v 36"/>
    <circle cx="270" cy="300" r="6" fill="#ff5aa5"/>
    <text x="270" y="360" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4fd8ff" text-anchor="middle" letter-spacing="1">BOOKING ENGINE</text>

    <!-- Right Node -->
    <circle cx="754" cy="300" r="38" fill="rgba(6, 16, 45, 0.85)"/>
    <path d="M 736 300 h 36 M 754 282 v 36"/>
    <circle cx="754" cy="300" r="6" fill="#4fd8ff"/>
    <text x="754" y="360" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ff5aa5" text-anchor="middle" letter-spacing="1">24/7 MULTI-LINE</text>
  </g>

  <!-- Sub-orbital targeting reticles -->
  <circle cx="512" cy="180" r="10" fill="none" stroke="#ff5aa5" stroke-width="2"/>
  <circle cx="512" cy="180" r="3" fill="#ffffff"/>
</svg>
