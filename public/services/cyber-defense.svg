<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="cyberBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#073a28" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#031a12" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#010704" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000201" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="coreAuraGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4fd8ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050618" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-Bleed Dark Space Background -->
  <rect width="1024" height="1024" fill="url(#cyberBg)"/>

  <!-- Center Atmospheric Core Aura -->
  <circle cx="512" cy="420" r="280" fill="url(#coreAuraGreen)"/>

  <!-- Cyber Defense Quantum Shield (Centered at 512, 420) -->
  <g transform="translate(512, 420)" filter="url(#glowGreen)">
    <!-- Outer Shield Contour -->
    <path d="M 0 -170 L 155 -90 L 155 50 Q 155 155 0 210 Q -155 155 -155 50 L -155 -90 Z" fill="rgba(12, 45, 32, 0.85)" stroke="#34d399" stroke-width="3.5"/>
    
    <!-- Inner Concentric Shield -->
    <path d="M 0 -125 L 110 -65 L 110 40 Q 110 115 0 155 Q -110 115 -110 40 L -110 -65 Z" fill="rgba(6, 60, 38, 0.45)" stroke="rgba(52, 211, 153, 0.45)" stroke-width="2" stroke-dasharray="8 5"/>

    <!-- Biometric Key / Lock Emblem -->
    <circle cx="0" cy="0" r="32" fill="#34d399"/>
    <rect x="-10" y="14" width="20" height="46" rx="5" fill="#34d399"/>
    <circle cx="0" cy="0" r="13" fill="#02030a"/>
  </g>

  <!-- Security Perimeter Matrix in corners -->
  <circle cx="260" cy="240" r="8" fill="#34d399"/>
  <circle cx="764" cy="240" r="8" fill="#34d399"/>
  <line x1="260" y1="240" x2="410" y2="300" stroke="rgba(52, 211, 153, 0.35)" stroke-width="2"/>
  <line x1="764" y1="240" x2="614" y2="300" stroke="rgba(52, 211, 153, 0.35)" stroke-width="2"/>
</svg>
